<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hexayurt Projection - Setup</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #1e1e1e;
      color: #eee;
      padding: 24px;
      margin: 0;
    }
    h2 { margin-top: 0; }
    label { display: block; margin-bottom: 18px; }
    input[type="number"] { width: 60px; margin-left: 8px; }
    .display-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }
    .display-row span { font-size: 13px; }
    select {
      padding: 4px 8px;
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
    }
    #displays { margin-bottom: 18px; }
    #error { color: #ff6b6b; font-size: 13px; min-height: 18px; margin-bottom: 8px; }
    .buttons { display: flex; gap: 10px; }
    button {
      padding: 10px 20px;
      font-size: 14px;
      background: #3a7afe;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #558cfe; }
    button:disabled { background: #555; cursor: not-allowed; }
    #identify { background: #444; }
    #identify:hover { background: #555; }
  </style>
</head>
<body>
  <h2>Projection setup</h2>
  <label>
    Projector slots
    <input id="slots" type="number" min="1" max="12" value="3">
  </label>
  <div id="displays"></div>
  <p id="error"></p>
  <div class="buttons">
    <button id="identify" type="button">Identify displays</button>
    <button id="launch" type="button">Launch</button>
  </div>
  <script src="settings.js"></script>
</body>
</html>
